[project]
name = "cycle-validation"
version = "0.1.0"
description = "Validazione dei cicli di riparazione contro manuali e dati strutturati"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic[bedrock]>=2.14.0",
    "claude-agent-sdk>=0.2.180",
    "fastapi>=0.162.5",
    "pillow>=13.0.0",
    "pydantic>=2.9",
    "pypdfium2>=5.0",
    "python-multipart>=0.0.33",
    "pyyaml>=6.0",
    "typer>=0.15",
    "uvicorn>=0.54.0",
]

[project.optional-dependencies]
# Client AWS (S3, Bedrock per la trascrizione, CloudWatch): servono in azienda, non ai test.
aws = ["boto3>=1.35"]
# Macchine attive da Redshift con connessione diretta, come la v1 (MACHINES_SOURCE=diretta).
redshift = ["redshift_connector>=2.1"]

[project.scripts]
cycle-validation = "cycle_validation.cli:app"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=1.13",
    "pytest>=8.3",
    "ruff>=0.8",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cycle_validation"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "-q"
markers = ["live: prova con il modello vero, solo con `pytest -m live` (MIGLIORIE A5)"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Argument", "typer.Option"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src"]

[[tool.mypy.overrides]]
# Librerie senza annotazioni di tipo.
module = ["pypdfium2", "pypdfium2.*", "boto3", "boto3.*"]
ignore_missing_imports = true

[tool.uv]
python-preference = "only-system"
