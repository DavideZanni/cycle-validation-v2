# Campagna di prove (`cycle-validation eval campagna`, COPILOT 3.5). Per ogni modello: la
# base e le varianti sul piccolo, poi sul grande la base e le varianti che si tengono. Le prove
# già fatte si saltano. Il report finale è runs/campagna.md. Questo file lo aggiorna Claude.

# Le varianti (eval/varianti/<nome>.yaml), in ordine. La base si fa sempre per prima.
# Dal 26-11 (tappa 3, secondo giro) la base ha `elementi_e_lingue` (elementi uno per uno e
# lingue separate): `elementi_uno_per_uno`, `lingue_separate`, `elementi_e_lingue` sono uguali
# alla base e `tutto_insieme` è uguale a `seconda_ricerca`, quindi si prova solo questa.
# 25-11: `tutto_insieme` 22 errori stabili e mai visti 5 su 29 contro 19 e 3 di
# `elementi_e_lingue`, scartata solo per il costo (2,2 volte la base vecchia; sulla base nuova
# è 1,9 volte).
# 26-11 sera: `seconda_ricerca` scartata (stessi errori, costo 2,1 volte la base sul grande).
# 26-11 sera: `definizioni_generali` scartata (14 contro 15 sul piccolo, 8 contro 10 sul
# grande: perde gli errori trovati per il motivo sbagliato e non trova quelli giusti).
# 27-11: `procedura_dr` nella base, `lingue_tra_loro` scartata (circa 10 errori in più ma
# 11-13 falsi errori a prova: traduzioni libere). Nella base anche la regola della scheda (I9,
# dà solo WARNING).
# CAMPAGNA FINALE (27-11, copie cieche del seme 3): la base contro `fonte_ispezione` (I8) e
# contro `finale` (I8 più il confronto tra le lingue stretto, I15). Quella che vince è la
# configurazione della produzione. `fonte_ispezione` da sola dice quanto vale I8 se `finale`
# avesse un falso errore per via delle lingue.
# 27-11 sera: `finale` e i controlli H17, H19 e la 010 sono nella base. Si misura la base
# nuova da sola (prima si archiviano le prove vecchie, COPILOT 3.8)
# 27-11 sera, dopo: `schede_e_limiti` (H18, la scheda coerente con l'operazione decisa dal
# codice, e la regola «almeno N contro più di N non è un errore»). La base è già fatta: si
# fanno solo le 3 prove della variante, sul piccolo e sul grande
# 27-11 notte: `schede_e_limiti` vince (34 contro 30 sul piccolo, 23 contro 18 sul grande,
# 0 falsi errori): nella base.
# 27-11 notte, dopo: la versione quasi finale (MG75-MG80, MG44, MG45, MG47, MG50, MG53) è nella
# base. Le prove della base sono già fatte (con il codice di prima) e si saltano: si fanno le 3
# prove di `quasi_finale` (uguale alla base nuova) sul piccolo e sul grande, nello stesso
# riepilogo delle prove di prima. Prima, gratis: `eval senza-modello` (COPILOT passo 4h)
# 28-11: `quasi_finale` si tiene (42 su 45, 31 su 31, 0 falsi). Le sue prove sono il
# riferimento (`riferimento`, sotto): la base ha prove fatte con il codice di prima. Campagna
# completa delle migliorie del 28-11, tutte spente nella base: MG48 (`altro_stadio`), MG54
# (`diretta`), MG56 (`diretta_cache`), MG59 (`testo_comune`), MG55 (`lingue_insieme`). Le
# prove già fatte (base, `schede_e_limiti`, `quasi_finale`) si saltano.
# 28-11, dopo: in campagna solo quello che cambia il modello. `altro_stadio` è solo codice: si
# prova con `eval senza-modello --variante` (0 $); MG83 è una regola finale: si prova con
# `eval rigioca` (0 $). `diretta` e `diretta_cache` sono una variante sola (la cache non cambia
# le risposte). Prima una prova sola di `diretta` sul piccolo (COPILOT passo 4i): se non
# risparmia, `testo_comune` e `lingue_insieme` (che stanno sopra `diretta`) non si fanno.
# 28-11 mattina: la prova di `diretta` costa 0,22 $ contro 0,35 $ con gli stessi errori: si
# fanno le prove che mancano di `diretta`, `testo_comune` e `lingue_insieme` (14 prove).
# `meno_avvisi` e `limiti_citati` sono regole finali: `eval rigioca`, non stanno qui.
varianti: [quasi_finale, diretta, testo_comune, lingue_insieme]

# La variante con cui si confrontano le altre. Vuoto = la base.
# 28-11, 12:37: campagna 4j finita (17 prove, 4,01 $). Nella base `lingue_insieme` (diretta,
# cache, lingue insieme) e la regola MG83; `testo_comune` scartata. Riferimento: `lingue_insieme`
# (le prove della base nuova senza la regola finale, che si rigioca).
# 28-11, 14:00: ultima prova, `controllo_finale` (la versione da portare in QA, così come è nel
# codice): una sul piccolo e una sul grande, con `--varianti controllo_finale --ripetizioni 1`
# (COPILOT passo 4m). Poi gli esperimenti sui cicli MOS e DR sono chiusi.
# 28-11, 14:30: fatta (0,43 $, 0 falsi errori, con MG87b falsi OK 0). Esperimenti chiusi.
riferimento: lingue_insieme

# Prove per variante: tre (le differenze sono di uno o due errori).
ripetizioni: 3

# Nome → id del modello. Vuoto = quello di data/settings.yaml (Haiku). Il primo usa le
# cartelle di sempre (runs/prove-piccolo, runs/prove-grande); gli altri le loro.
# Sonnet tolto il 24-11 sera: sul piccolo non trova più errori di Haiku e costa 12 volte tanto
# (le sue prove restano in runs/prove-piccolo-sonnet). Per riprovarlo:
#   sonnet: eu.anthropic.claude-sonnet-5-5
modelli:
  haiku:

insiemi: [piccolo, grande]

# Sul grande: se_si_tiene (base + varianti che si tengono sul piccolo), sempre, mai.
# 27-11: sempre. I falsi errori che contano (traduzioni libere, «4 volte») sono sui cicli veri.
grande: sempre

# Tetto di spesa della campagna, in dollari. Il 26-27-11: base 0,22-0,26 $ a prova,
# `lingue_tra_loro` 0,39-0,56 $. Questa: circa 6 $ (18 prove). Arrivata al tetto la campagna si
# ferma; rilanciata, riparte da dove era.
# 28-11: 3 varianti nuove x 6 prove, circa 0,4 $ a prova (meno con la chiamata diretta) =
# circa 6-7 $. Con la chiamata diretta (0,22 $ a prova sul piccolo): circa 4-5 $.
massimo_dollari: 10
