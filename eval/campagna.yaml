# Campagna di prove (`cycle-validation eval campagna`, COPILOT 3.5). Per ogni modello: la
# base e le varianti sul piccolo, poi sul grande la base e le varianti che si tengono. Le prove
# già fatte si saltano. Il report finale è runs/campagna.md. Questo file lo aggiorna Claude.

# Le varianti (eval/varianti/<nome>.yaml), in ordine. La base si fa sempre per prima.
# Dal 26-11 (tappa 3, secondo giro) la base ha `elementi_e_lingue` (elementi uno per uno e
# lingue separate): `elementi_uno_per_uno`, `lingue_separate`, `elementi_e_lingue` sono uguali
# alla base e `tutto_insieme` è uguale a `seconda_ricerca`, quindi si prova solo questa.
# 25-11: `tutto_insieme` 22 errori stabili e mai visti 5 su 29 contro 19 e 3 di
# `elementi_e_lingue`, scartata solo per il costo (2,2 volte la base vecchia; sulla base nuova
# è 1,9 volte).
# 26-11 sera: `seconda_ricerca` scartata (stessi errori, costo 2,1 volte la base sul grande).
# 26-11 sera: `definizioni_generali` scartata (14 contro 15 sul piccolo, 8 contro 10 sul
# grande: perde gli errori trovati per il motivo sbagliato e non trova quelli giusti).
# Ora `lingue_tra_loro` e `procedura_dr` (Copilot: 895167b9 005 è un falso errore, la deroga
# della D.R. non arriva al modello). La base è nuova (controllo dei numeri tra le lingue
# corretto: codici e conversioni scritte prima del numero), quindi si rifà anche lei.
varianti:
  - lingue_tra_loro
  - procedura_dr

# Prove per variante: tre (le differenze sono di uno o due errori).
ripetizioni: 3

# Nome → id del modello. Vuoto = quello di data/settings.yaml (Haiku). Il primo usa le
# cartelle di sempre (runs/prove-piccolo, runs/prove-grande); gli altri le loro.
# Sonnet tolto il 24-11 sera: sul piccolo non trova più errori di Haiku e costa 12 volte tanto
# (le sue prove restano in runs/prove-piccolo-sonnet). Per riprovarlo:
#   sonnet: eu.anthropic.claude-sonnet-5-5
modelli:
  haiku:

insiemi: [piccolo, grande]

# Sul grande: se_si_tiene (base + varianti che si tengono sul piccolo), sempre, mai.
# 26-11 sera: sempre. `lingue_tra_loro` sui cicli veri può dare ERRATO dove una lingua
# traduce liberamente, e i falsi errori che `procedura_dr` deve togliere sono sul grande.
grande: sempre

# Tetto di spesa della campagna, in dollari. Il 26-11 sera 12 prove sono costate 2,77 $.
# Con `lingue_tra_loro` (una sessione corta in più per operazione) e `procedura_dr` circa
# 5 $. Arrivata
# al tetto la campagna si ferma; rilanciata, riparte da dove era.
massimo_dollari: 10
