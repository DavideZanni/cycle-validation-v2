# Errori noti dei cicli «con errori» (stampe modificate a mano) e stampe giuste.
# Chiave: prime 8 cifre dell'impronta SHA-256 del PDF. Niente codici veri: solo numeri di
# operazione e descrizioni generiche. Si usa con `cycle-validation eval prova` (COPILOT sezione 3).
# Gli errori dei quattro cicli senza stampa giusta conosciuta sono quelli trovati dal controllo
# delle due lingue il 23-11: da confermare con chi ha preparato le stampe.
# `in_attesa` (operazione → che cosa aspetta): l'operazione oggi non si può giudicare. Un errore
# noto lì non conta come mancato (24-11: si trova solo con un documento che non c'è o con una
# regola da chiedere); un ERRATO lì non conta come falso errore.
cicli:
  298bc28e:
    errori:
      "005": codice di un subtask cambiato (solo in italiano)
      "035": parole cambiate nella descrizione
  c5ff3cd6:
    errori:
      "030": scheda tolta
      "040": un numero cambiato (spessore)
    # P6 (26-11): in un processo speciale senza scheda la regola dà WARNING «scheda forse
    # mancante», mai ERRATO: l'errore resta fuori dal conteggio degli ERRATO
    in_attesa:
      "030": "P6: scheda mancante = WARNING, non ERRATO (regola da scrivere)"
  f355dc3c:
    errori:
      "010": tre numeri cambiati
      "030": numeri e parole cambiati
      "040": una lettera cambiata (la classe)
      "050": una frase sostituita (dice il contrario)
    in_attesa:
      "040": "documento non nella conoscenza (capitolo 70-23 dell'SPM o manuale d'ispezione)"
  38960731:
    errori:
      "050": un numero cambiato (solo in una lingua)
  5ff17062:
    # P9 (26-11, verificato con `confronta`): è la stampa giusta 04ecaabe con quattro
    # operazioni cambiate, come f355dc3c
    errori:
      "010": tre numeri cambiati
      "030": numeri cambiati in una lingua, parole cambiate nell'altra
      "040": la classe cambiata in due punti
      "050": la frase dei limiti sostituita; in inglese due negazioni tolte
    in_attesa:
      "040": "documento non nella conoscenza (come f355dc3c 040)"
  8d3c673c:
    errori:
      "140": un numero cambiato (solo in una lingua)
  e9b74c84:
    errori:
      "025": un numero cambiato (solo in una lingua)
  4e64d49a:
    giusto: true
    di: 298bc28e
  8bdb25d5:
    giusto: true
    di: c5ff3cd6
  04ecaabe:
    giusto: true
    di: f355dc3c
    # P7 (26-11): il «4 volte» è giusto (manuale del motore), l'ERRATO della v2 qui è un falso
    # errore. Resta in attesa finché non c'è `fonte_ispezione` (MIGLIORIE 7.3): poi si toglie
    # da qui e un ERRATO conta come falso errore
    in_attesa:
      "050": "P7: falso errore noto, si toglie con fonte_ispezione"
