# Errori noti dei cicli «con errori» (stampe modificate a mano) e stampe giuste.
# Chiave: prime 8 cifre dell'impronta SHA-256 del PDF. Niente codici veri: solo numeri di
# operazione e descrizioni generiche. Si usa con `cycle-validation eval prova` (COPILOT sezione 3).
# Gli errori dei quattro cicli senza stampa giusta conosciuta sono quelli trovati dal controllo
# delle due lingue il 23-11: da confermare con chi ha preparato le stampe. Il 27-11 sera, dal
# testo originale delle stampe (docs/CONFRONTO_V1_14_CICLI.md, la v1 sugli stessi cicli), ne
# sono stati aggiunti altri: cambi fatti a mano che il confronto delle lingue non vede (codici
# di task, schede, macchine) e che la v1 segnala.
# `in_attesa` (operazione → che cosa aspetta): l'operazione oggi non si può giudicare. Un errore
# noto lì non conta come mancato (24-11: si trova solo con un documento che non c'è o con una
# regola da chiedere); un ERRATO lì non conta come falso errore.
cicli:
  298bc28e:
    errori:
      "005": codice di un subtask cambiato (solo in italiano)
      "035": parole cambiate nella descrizione
  c5ff3cd6:
    errori:
      "030": scheda tolta
      "040": un numero cambiato (spessore)
    # P6 (26-11): in un processo speciale senza scheda la regola dà WARNING «scheda forse
    # mancante», mai ERRATO: l'errore resta fuori dal conteggio degli ERRATO
    in_attesa:
      "030": "P6: scheda mancante = WARNING, non ERRATO (regola da scrivere)"
  f355dc3c:
    errori:
      "010": tre numeri cambiati
      "030": numeri e parole cambiati
      "040": una lettera cambiata (la classe)
      "050": una frase sostituita (dice il contrario)
    in_attesa:
      "040": "documento non nella conoscenza (capitolo 70-23 dell'SPM o manuale d'ispezione)"
  38960731:
    # 27-11 sera: nel testo ci sono altri cambi fatti a mano (una parola minuscola in una
    # stampa tutta maiuscola, la stessa operazione con due macchine diverse su due pagine, i
    # limiti dell'inglese più alti del totale). La v1 li segnala tutti
    errori:
      "010": i limiti cambiati in inglese (in italiano restano quelli giusti)
      "030": il task del manuale cambiato (una cifra)
      "040": la macchina cambiata in una pagina; cambiati il codice della scheda e il suo task
      "050": un numero cambiato (solo in una lingua); in inglese una parola cambiata (dice il contrario); cambiato il codice della scheda
  5ff17062:
    # P9 (26-11, verificato con `confronta`): è la stampa giusta 04ecaabe con quattro
    # operazioni cambiate, come f355dc3c
    errori:
      "010": tre numeri cambiati
      "030": numeri cambiati in una lingua, parole cambiate nell'altra
      "040": la classe cambiata in due punti
      "050": la frase dei limiti sostituita; in inglese due negazioni tolte
    in_attesa:
      "040": "documento non nella conoscenza (come f355dc3c 040)"
  22f586bb:
    # 26-11 sera (Copilot): era tra i cicli veri, ma è la stampa giusta 737dec71 con quattro
    # operazioni cambiate. Gli stessi errori di 895167b9 (che è questa con il serial nella 005).
    # È un DR senza serial: la v2 non sa quali documenti usare e dà FONTE_ASSENTE su tutte e
    # quattro (campagna del 26-11 sera). Si possono trovare solo confrontando le due lingue tra
    # loro (`lingue_tra_loro`)
    errori:
      "010": un limite cambiato in una lingua (minimo invece di massimo)
      "030": un numero di documento cambiato; in una lingua una frase aggiunta
      "050": il materiale cambiato in una lingua; cambiato anche il codice della scheda
      "060": una negazione tolta in una lingua; cambiato anche il codice della scheda
  895167b9:
    # 26-11 (Copilot sulle prove del grande): era tra i cicli veri, ma è una copia modificata:
    # 22f586bb con il serial aggiunto nella 005 (la 005 non è un errore). 010 e 030 la v2 le
    # trovava per il motivo sbagliato, 050 la dava per corretta. 26-11 sera (Copilot): l'ERRATO
    # sulla 005 è un falso errore (il manuale manda a sostituire, la deroga citata nella 005
    # autorizza la raccordatura e la v2 non la dà al modello: variante `procedura_dr`). Resta
    # fuori dalla lista: esce tra gli ERRATO da verificare, per variante
    errori:
      "010": un limite cambiato in una lingua (minimo invece di massimo)
      "030": un numero di documento cambiato; in una lingua una frase aggiunta
      "050": il materiale cambiato in una lingua; cambiato anche il codice della scheda
      "060": una negazione tolta in una lingua; cambiato anche il codice della scheda
  8d3c673c:
    # 27-11 sera: nelle due schede dei processi speciali codice e task diversi da tutte le
    # altre stampe (probabili cambi a mano: non c'è la stampa giusta). La v1 li segnala
    errori:
      "100": il codice della scheda e il suo task cambiati (probabile)
      "110": il codice della scheda e il suo task cambiati (probabile)
      "140": un numero cambiato (solo in una lingua)
  e9b74c84:
    # 27-11 sera: dal confronto con la stampa A3 dello stadio 7 (stesso testo). La v1 li segnala
    errori:
      "025": un numero cambiato (solo in una lingua); anche il task del manuale cambiato
      "040": una parola cambiata in inglese (dice «raccordato» invece di «rimosso»)
  4e64d49a:
    giusto: true
    di: 298bc28e
  8bdb25d5:
    giusto: true
    di: c5ff3cd6
    # P10 (27-11, Copilot): la 040 «lubrificante applicato» e «coating» danno la stessa
    # istruzione (il coating è lo strato di lubrificante): un ERRATO lì è un falso errore
  04ecaabe:
    giusto: true
    di: f355dc3c
    # P7 (26-11): il «4 volte» è giusto (manuale del motore), l'ERRATO della v2 qui è un falso
    # errore. Resta in attesa finché non c'è `fonte_ispezione` (MIGLIORIE 7.3): poi si toglie
    # da qui e un ERRATO conta come falso errore
    # P10 (27-11, Copilot): la 030 è un errore vero della stampa, «larghezza» in italiano contro
    # «length» in inglese (più avanti l'italiano dice «semi-lunghezza»: sbaglia l'italiano). Si
    # trova solo confrontando le lingue, e non è né una negazione né un limite (I15 non lo
    # cerca): resta in attesa, così le prove restano confrontabili con quelle di prima
    in_attesa:
      "030": "P10: errore vero della stampa (larghezza contro length), solo tra le lingue"
      # P12 (27-11 sera, Copilot): con fonte_ispezione la v2 cita la sezione d'ispezione del
      # manuale del motore; l'ERRATO (3 su 3 nel piccolo, 0 nel grande) dice che l'italiano
      # «almeno 4 volte la larghezza» comprende il caso uguale a 4, l'inglese e il manuale «più
      # di 4»: una differenza vera ma piccola tra le lingue. Resta in attesa: un dubbio
      "050": "P7 e P12: «almeno 4 volte» contro «più di 4 volte» tra le lingue (dubbio)"
  737dec71:
    # 26-11 sera (Copilot): la stampa giusta da cui vengono 22f586bb e 895167b9
    giusto: true
    di: 22f586bb
    # P10 (27-11, Copilot): la 060 è un errore vero della stampa: «superiore a 4X» in italiano,
    # «not to exceed 4X» in inglese; vale l'inglese (le altre stampe dicono «sino 4X»). Un
    # ERRATO qui è giusto. Resta in attesa (non conta né come trovato né come falso errore),
    # così le prove restano confrontabili con quelle di prima
    in_attesa:
      "060": "P10: errore vero della stampa (limite al contrario tra le lingue)"
  2d724fba:
    # ciclo vero: per la v2 una stampa giusta. 26-11 (Copilot): l'ERRATO della 050 è un falso
    # errore come quello della P7 («4 volte» contro la definizione generica di «3 volte»).
    # In attesa finché `definizioni_generali` o `fonte_ispezione` non lo tolgono
    giusto: true
    # P10 (27-11, Copilot): la 030 ha lo stesso testo della 030 di 04ecaabe («larghezza» contro
    # «length»), ma per questo stadio il manuale chiede tutte e due le misure, tranne sui bordi:
    # uguali nell'uso comune, diverse se l'operazione vale anche sui bordi. Un dubbio: in attesa
    in_attesa:
      "030": "P10: dubbio (larghezza contro length: dipende se vale anche sui bordi)"
      "050": "P7 su un ciclo vero: falso errore noto (definizione generica dell'SPM)"
  # P12 (27-11 sera, Copilot): tre cicli veri con la stessa 060 di 737dec71, parola per parola
  # («superiore a 4X» in italiano, «not to exceed 4X» in inglese): errore vero della stampa,
  # trovato solo da `finale` (nella base dal 27-11 sera)
  414d85ca:
    errori:
      "060": "P12: errore vero della stampa (limite al contrario tra le lingue, come 737dec71)"
  477abec8:
