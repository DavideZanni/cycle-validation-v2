name: dr
enabled: true
file_limits:
  require_pdf_header: true
  min_chars: 100
checks:
  - dr_recommendation
  - source
  - task_code
  - machine_tag
  - process_sheet
  - operation_description
# Se la recommendation non è applicabile i controlli successivi non partono.
blocking_checks: [dr_recommendation]
requires_selectors: true
reference_mode: task
excluded_sheet_prefixes: [SWJ, SSS, SPS]
engine_families: [GENX, LEAP]
extraction_prompt: extract_cycle.md
# Stesso modulo PVRM320 di MOS ed EJ200 (verificato su una stampa DR reale il 16/11/2026):
# parser di layout davanti all'LLM, che resta la riserva se il layout non è riconosciuto.
layout_extractor: pvrm320
